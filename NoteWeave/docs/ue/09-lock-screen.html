<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>UE-09 应用锁屏</title>
<link rel="stylesheet" href="wireframe.css">
</head>
<body>
<div class="wf-title">UE-09 应用锁屏 LockScreen</div>
<div class="wf-desc">启用应用锁后启动/唤起时的全屏遮罩，最高浮层优先级。<a class="back" href="index.html">← 返回索引</a></div>

<div class="wf-screen rel" style="background:#222">
  <div class="col center grow" style="gap:18px; color:#ddd; min-height:660px">
    <div style="font-size:44px">🧶</div>
    <div style="font-size:18px; font-weight:600">织记已锁定</div>
    <div style="font-size:12px; color:#999">输入密码以继续</div>
    <div class="input" style="width:260px; text-align:center; letter-spacing:6px; background:#333; border-color:#555; color:#eee">••••••</div>
    <span class="btn primary" style="width:260px; justify-content:center">解锁</span>
    <div style="font-size:11px; color:#c0392b">密码错误，请重试<span class="note-tag">错误时输入框抖动动画</span></div>
  </div>
</div>

<div class="annotation-list">
  <b>交互说明</b>
  <ol>
    <li>密码在设置中开启/修改；本地 PBKDF2 + timingSafeEqual 校验，不上传不联网。</li>
    <li>解锁后回到锁定前视图；锁屏遮罩优先级高于一切覆盖层/对话框。</li>
    <li>连续错误不锁死（本地应用），仅抖动 + 错误提示。</li>
  </ol>
</div>
</body>
</html>
