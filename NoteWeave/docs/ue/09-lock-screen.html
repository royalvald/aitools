<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>UE-09 应用锁屏</title>
<link rel="stylesheet" href="wireframe.css">
</head>
<body>
<div class="wf-title">UE-09 应用锁屏 LockScreen</div>
<div class="wf-desc">启用应用锁后启动/唤起时的全屏遮罩，最高浮层优先级。 <span class="status partial">🟡 部分实现 · 差距见 <a href="../UE_IMPL_GAP.md">IMPL_GAP §3.2</a></span> <a class="back" href="index.html">← 返回索引</a></div>

<div class="wf-screen rel" style="background:var(--wf-text)">
  <div class="col center grow" style="gap:18px; color:var(--wf-border-2); min-height:660px">
    <div style="width:56px; height:56px; border-radius:15px; background:var(--wf-primary); color:var(--wf-screen); display:flex; align-items:center; justify-content:center; font-size:25px; font-weight:700; box-shadow:var(--wf-shadow-md)">织</div>
    <div style="font-size:18px; font-weight:600; display:inline-flex; align-items:center; gap:8px"><svg class="ic ic-lg" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>织记已锁定</div>
    <div style="font-size:12px; color:var(--wf-text-3)">输入密码以继续</div>
    <div class="input focus" style="width:260px; justify-content:center; letter-spacing:6px; background:transparent; color:var(--wf-surface-3)">••••••</div>
    <span class="btn primary" style="width:260px; justify-content:center">解锁</span>
    <div style="font-size:11px; color:var(--wf-danger)">密码错误，请重试<span class="note-tag">错误时输入框抖动动画</span></div>
  </div>
</div>

<div class="annotation-list">
  <b>交互说明</b>
  <ol>
    <li>密码在设置中开启/修改；本地 PBKDF2 + timingSafeEqual 校验，不上传不联网。</li>
    <li>解锁后回到锁定前视图；锁屏遮罩优先级高于一切覆盖层/对话框。</li>
    <li>连续错误不锁死（本地应用），仅抖动 + 错误提示。</li>
  </ol>
</div>
</body>
</html>
