[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autobugfixer"
version = "0.1.0"
description = "自动化 Bug 修复系统：缺陷平台拉取 -> 预处理 -> AI 修复 -> 部署验证 -> 经验沉淀"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy>=2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langchain>=1",
    "langchain-anthropic>=0.3",
    "cryptography>=42",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
autobugfixer-api = "autobugfixer.api.app:main"
autobugfixer-import = "autobugfixer.cli:main"
autobugfixer-scheduler = "autobugfixer.scheduler_cli:main"
autobugfixer-export = "autobugfixer.export_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autobugfixer = ["prompts/templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
